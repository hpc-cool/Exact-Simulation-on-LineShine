 #======== CPLDEF:CCSM 耦合参数'========
 # NCPL :每天耦合次数'
 # ==================================
 &CPLDEF
 NCPL=1
 /
 # 系统参数
 # NCorePClu  :每簇(NUMA)核数(38)
 # MCorePClu  ;每簇(NUMA)可用核数(38),假设不可用核在最后
 # NCluPNode  :每节点簇数(16)
 # NManageCore;管理核核数，编号>NCorePClu*NCluPNode
 # 软件设置参数
 # NThPGrp :每组启动线程数(38),2<=NProcPNode<=MCorePClu
 # NGrpPProc:每进程组数(16),<=NCluPNode ,支持 4,8,16,
 # NProcPNode:每节点进程数(1),<=NCluPNode/NGrpPProc
 # ManageCoreId:管理核(-1)
 # 测试用参数
 # OffClu   :第一组使用的簇(0)
 # SkipClu  :几个簇启动1个组间(1)
 # OffCore  :每个组使用的第一个核(0)
 # SkipCore :几个核启动一个线程(1)
 &THEADSEF
 NCorePClu    =   38,
 MCorePClu    =   37,
 NCluPNode    =   16,
 NManageCore  =    0,
 NGrpPProc    =   16,
 NThPGrp      =   36,
 NProcPNode   =    1,
 ManageCoreid =   -1,
 OffClu       =    0,
 SkipClu      =    1,
 OffCore      =    0,
 SkipCore     =    1
 /
