 # OUTdef:输出参数
 # AVHIST_OPTIONS,AVHIST_NS:
 # REST_OPTION,REST_N:
 #   "AUTO":use CPL Control;"NONE","NEVER":Not Output;
 #   "NSTEPS":N Steps;"NHOURS: N Hours;"NDAYS":N Days;"NMONTHS":N months;"NYEARS":N Years
 #   "daily": 1day;"monthly":1 month,"yearly":1 year
 #   if(N<0):Mean OutPut not Average,transient field
 # HIST_NTPF,AVHIST_NTPFS :每文件输出次数,>0: n Times;
 #    0: 1 day;
 #   -1: 1 month;
 #   -2: 1 Season;
 #   -3: half year: 
 #  <-3: -n-4 year 
 # AVHIST_OTAGS: OutName Tag,default:"ahi"
 # AVHIST_TAGS,AVHIST_OPTION,AVHIST_NS,AVHIST_NTPFS:is array surport Multi(max 16) Output
 &OUTDEF
 REST_OPTION = "NMONTH  ",
 REST_N = 1,
 AVHIST_OTAGS = "h",15*" ",
 AVHIST_OPTIONS ="NHOURS",15*"NONE",
 AVHIST_NS = 1,15*24,
 AVHIST_NTPFS =-4, 15*-1,
 LOGBVS   = 6,0,14*0,
 LOGWINDS = 6,0,14*0,
 LOGHSS   = 6,0,14*0,
 LOGTPS   = 6,0,14*0,
 LOGTZS   = 6,0,14*0,
 LOGTHS   = 6,0,14*0,
 LOGAUS   = 16*0
 /
 # =====implschPara:源函数系数========
 # beta0,beta1:WIND INPUT COEFFICIENT
 # brkd1,brkd2:WIND INPUT COEFFICIENT
 # acu:Current COEFFICIENT
 # ==================================
 &IMPLSCHPARA
 BETA0   =   1.000000    ,
 BETA1   =  0.0000000E+00,
 ACU     =   1.000000    ,
 BRKD1   =  1.3200000E-04,
 BRKD2   =   2.610000
 /

 # PKPARA:波束划分参数
 # KL波束划分数 ,kld,总波束划分数,jnthet 方向划分数
 # wk(k)=wkmin*(pwk**(k-1))
 &PKPARA
 PWK     =   1.210000    ,
 WKMIN   =  7.1000000E-03,
 KL      =    32,
 KLD     =    32,
 JNTHET  =    12
 /

