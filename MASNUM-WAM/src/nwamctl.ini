 # ===========GPARA: 全局参数=========
 # (gxlon0-gxlon1,gylat0-gylat1):计算区域
 # deltts:时间步长(s),ngpd:每度网格数
 # 1deg:1h/3,0.5deg:1h/5,1/4deg:1h/10(1h/9不行)
 # 1/8:1h/20 1/20: 1/50 
 # 1/60:20 0.0166666666667
 # Gcircle:全球模式,环绕
 # logscurr:THE SWITCH FOR WAVE-CURRENT INTERACTION
 # logsdiss:THE SWITCH FOR Sds,1-Yuan's,0-Komen's
 # ==================================
 &GPARA
 DELTTS  =    12.0000    ,
 GXLON0  =  -180.0000    ,
 GYLAT0  =   -60.0000    ,
 GXLON1  =   180.0000    ,
 GYLAT1  =    60.0000    ,
 GRDSZX  =     0.01      ,
 GRDSZY  =     0.01      ,
 GCIRCLE =   1,
 windfield = 200,
 LOGSCURR  = 0,
 LOGSDISS  = 0
 /

